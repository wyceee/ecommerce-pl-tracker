<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revenue Tracker — E-commerce P&L</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <div class="toast hidden" id="toast"></div>
  <div class="header animate-in">
    <div>
      <h1>Revenue Tracker</h1>
      <p>E-commerce P&L</p>
    </div>
    <div class="header-actions">
      <select class="store-select" id="storeFilter" onchange="render()"></select>
      <button class="gear-btn" onclick="openSettings()" title="Settings">⚙</button>
    </div>
  </div>
  <div class="period-panel animate-in delay-1">
    <div class="period-tabs" id="periodTabs"></div>
    <div id="customRangeSlot"></div>
  </div>
  <div class="month-nav animate-in delay-1 hidden" id="monthNav">
    <button class="month-btn" onclick="changeMonth(-1)">←</button>
    <span class="month-label" id="monthLabel"></span>
    <button class="month-btn" onclick="changeMonth(1)">→</button>
  </div>
  <div class="range-meta animate-in delay-2">
    <div>
      <div class="range-title" id="rangeTitle">Today</div>
      <div class="range-sub" id="rangeSub"></div>
    </div>
    <div class="range-note hidden" id="rangeNote"></div>
  </div>
  <div class="tabs animate-in delay-2">
    <button class="tab active" data-view="dashboard" onclick="switchView('dashboard',this)">Overview</button>
    <button class="tab" data-view="revenue" onclick="switchView('revenue',this)">Revenue</button>
    <button class="tab" data-view="costs" onclick="switchView('costs',this)">Costs</button>
  </div>
  <div id="view-dashboard"></div>
  <div id="view-revenue" class="hidden"></div>
  <div id="view-costs" class="hidden"></div>
  <div class="footer">
    <span>Data saved in browser</span><span>·</span>
    <button class="reset-btn" onclick="resetData()">Reset All Data</button>
  </div>
</div>

<div class="modal-overlay hidden" id="settingsModal" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Settings</span>
      <button class="modal-close" onclick="closeSettings()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-section">
        <div class="modal-section-title">Manage Stores</div>
        <div class="store-list" id="storeList"></div>
        <div class="add-store-row">
          <input type="text" class="form-input" id="newStoreName" placeholder="New store name..." onkeydown="if(event.key==='Enter')addStore()">
          <input type="color" class="color-input" id="newStoreColor" value="#6366f1">
          <button class="small-btn" onclick="addStore()">Add</button>
        </div>
      </div>
      <div class="modal-section">
        <div class="modal-section-title">Currency</div>
        <div class="currency-grid" id="currencyGrid"></div>
      </div>
      <div class="modal-section">
        <div class="modal-section-title">Import & Export</div>
        <div class="io-row">
          <button class="io-btn" onclick="exportData()">
            <span class="io-icon">↓</span>
            <span class="io-btn-label">Export Data<span class="io-btn-sub">Download as JSON</span></span>
          </button>
          <button class="io-btn" onclick="document.getElementById('importInput').click()">
            <span class="io-icon">↑</span>
            <span class="io-btn-label">Import Data<span class="io-btn-sub">Load from JSON</span></span>
          </button>
          <input type="file" accept=".json" class="import-file-input" id="importInput" onchange="importData(event)">
        </div>
      </div>
      <div class="modal-section">
        <div class="modal-section-title" style="display:flex;align-items:center;gap:8px">
          <svg viewBox="0 0 20 20" fill="currentColor" style="width:13px;height:13px;opacity:0.6"><path fill-rule="evenodd" d="M10 0C4.477 0 0 4.477 0 10s4.477 10 10 10 10-4.477 10-10S15.523 0 10 0zm0 18a8 8 0 100-16A8 8 0 0010 18zm-1-8V6a1 1 0 112 0v4a1 1 0 01-.293.707l-2 2a1 1 0 01-1.414-1.414L9 10z" clip-rule="evenodd"/></svg>
          Shopify Integration
        </div>
        <div id="shopifySection"></div>
      </div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
